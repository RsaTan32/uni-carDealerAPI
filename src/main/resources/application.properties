# Kubernetes
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
# Local development
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=carrental_local
%dev.quarkus.datasource.password=admin
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/cardealer
%dev.quarkus.hibernate-orm.schema-management.strategy=validate
# Hibernate
quarkus.hibernate-orm.schema-management.strategy=none
# Authentication
quarkus.security.jaxrs.deny-unannotated-endpoints=true
mp.jwt.verify.issuer=car-rental-api
mp.jwt.verify.audiences=car-rental-api
mp.jwt.verify.clock.skew=5
app.auth.token-lifetime-seconds=900
app.auth.bootstrap-admin.email=
app.auth.bootstrap-admin.password=
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.auto-add-security-requirement=false
quarkus.swagger-ui.path=/q/swagger-ui
%prod.quarkus.swagger-ui.always-include=true
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}
# Existing databases baseline at V0; empty databases also receive the initial schema.
quarkus.flyway.migrate-at-start=false
%test.quarkus.datasource.devservices.enabled=false
%dev.quarkus.flyway.baseline-on-migrate=true
%dev.quarkus.flyway.baseline-version=0
%dev.quarkus.flyway.migrate-at-start=true