apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-rental-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: car-rental-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: car-rental-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        runAsGroup: 185
        fsGroup: 185
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: car-rental-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: car-rental-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: car-rental-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: car-rental-db
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - name: jwt
              mountPath: /run/secrets/jwt
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: jwt
          secret:
            secretName: car-rental-jwt
            defaultMode: 288
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi