apiVersion: v1
kind: ConfigMap
metadata:
  name: car-rental-config
data:
  DB_JDBC_URL: jdbc:postgresql://postgres.postgres.svc.cluster.local:5432/cardealer
  JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt/publicKey.pem
  JWT_PRIVATE_KEY_LOCATION: file:/run/secrets/jwt/privateKey.pem
  QUARKUS_HTTP_HOST: 0.0.0.0
  QUARKUS_HTTP_LIMITS_MAX_BODY_SIZE: 64K
  QUARKUS_DATASOURCE_JDBC_MAX_SIZE: '10'
  QUARKUS_DATASOURCE_JDBC_ACQUISITION_TIMEOUT: 10S
  QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: validate
  QUARKUS_FLYWAY_MIGRATE_AT_START: 'false'