name: Test and publish image

on:
    pull_request:
    push:
        branches: [main, master]
        paths-ignore:
            - "k8s/**"
            - "docs/**"
            - "**/*.md"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Test and package
              run: bash mvnw -B verify
            - name: Validate Kubernetes templates
              run: |
                  kubectl kustomize k8s/backend > /dev/null
                  kubectl kustomize k8s/overlays/https > /dev/null
            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports
                  path: target/surefire-reports/
            - name: Upload application
              uses: actions/upload-artifact@v4
              with:
                  name: quarkus-app
                  path: target/quarkus-app/
                  retention-days: 1

    publish:
        if: github.event_name != 'pull_request'
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - uses: actions/download-artifact@v4
              with:
                  name: quarkus-app
                  path: target/quarkus-app/
            - name: Select image name
              id: image
              shell: bash
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
            - uses: docker/setup-buildx-action@v3
            - name: Build release image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: src/main/docker/Dockerfile.jvm
                  load: true
                  tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
                  labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Verify packaged production image
              env:
                  RELEASE_IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
              run: bash mvnw -B "-Drelease.image=$RELEASE_IMAGE" -Dtest=ProductionImageTest test
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Push verified image
              env:
                  RELEASE_IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
              run: docker push "$RELEASE_IMAGE"
            - name: Deployment instructions
              env:
                  IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
              run: echo "Published $IMAGE. Promote this exact image in k8s/backend/kustomization.yaml."
